      add('technician','Get trusted technical help','Get help from the device manufacturer or a trusted technician.','Use this help when finding or removing malware is difficult, or the device has no suitable scan function. You do not need to finish an unavailable scan first.',['ftc','moneysmart'],'If scanning or removal is unavailable or you need help');

  function reconcile(previous,steps) {

  function registered(host) {

    let suffixLength=0, exceptionLength=0;
    for(let i=0;i<labels.length;i++) {

      if(exact.has(tail))suffixLength=Math.max(suffixLength,count);

  function checkOne(raw,index) {
    const flags=[], unknowns=[], add=(code,reason)=>flags.push({id:index+':'+code,code,reason});

    else if(host.length>253||host.split('.').some(x=>!x||x.length>63||! /^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$/.test(x)))unknowns.push('The host has an unsupported or invalid domain format.');

  function analyze(text,dismissed=[]) {

      case 'transition':return transition(input.state,input.command,input.id);

    }} catch (_) { return operation==='summary'?'Unknown — the summary could not be prepared.':{ok:false,status:'Unknown',errors:['The input could not be interpreted.'],items:[],notes:['The input could not be interpreted.'],steps:[],unknowns:['The input could not be interpreted.']}; }
  };
})();



// The browser, CLI and MCP use the same plan/analyzer and categorical validation.
const PLAN_INPUT = {
  type: 'object', additionalProperties: false, required: ['did', 'account', 'reused'],
  properties: {
    did: {type:'string',enum:['typed_password','typed_card','sent_id_photo','installed_file','clicked_only']},
    account: {type:'string',enum:['personal','school','work','not_sure']},
    reused: {type:'string',enum:['yes','no','not_sure']},
  },
};
const DISSECT_INPUT = {
  type:'object', additionalProperties:false, required:['text'],
  properties:{text:{type:'string',minLength:1,maxLength:12000}},
};
const stringArray = {type:'array',items:{type:'string'}};
const objectSchema = properties => ({type:'object',required:Object.keys(properties),additionalProperties:false,properties});
const textFields = names => Object.fromEntries(names.map(name=>[name,{type:'string'}]));
const errorOutput = objectSchema({error:objectSchema(textFields(['code','message']))});
const stepOutput = objectSchema({
  ...textFields(['id','title','short','action','why','condition','signature','source']),
  sources:{type:'array',minItems:1,items:objectSchema({agency:{type:'string'},url:{type:'string',format:'uri'}})},
});
const planOutput = objectSchema({
  ok:{const:true},status:{const:'Unknown'},unknowns:stringArray,errors:stringArray,
  steps:{type:'array',items:stepOutput},
});
const analysisOutput = objectSchema({
  status:{type:'string',enum:['Unknown','Strong caution','No flags found — not a safety verdict']},notes:stringArray,
  items:{type:'array',maxItems:10,items:objectSchema({
    id:{type:'integer'},host:{type:'string'},domain:{type:['string','null']},port:{type:['string','null']},demo:{type:'boolean'},unknowns:stringArray,
    flags:{type:'array',items:objectSchema(textFields(['id','code','reason']))},
  })},
});
const TOOL_DEFINITIONS = [
  {name:'first_aid_plan',description:'Offline first-aid guidance for one reported incident category. Conditions and uncertainty are part of every plan; no account or device actions are performed.',inputSchema:PLAN_INPUT,outputSchema:{type:'object',oneOf:[planOutput,errorOutput]}},
  {name:'dissect_links',description:'Inspect redacted or fictional message text offline. Does not visit links, follow redirects, establish ownership, or declare a destination safe. Hosts can contain personal information; use fictional data for the demo.',inputSchema:DISSECT_INPUT,outputSchema:{type:'object',oneOf:[analysisOutput,errorOutput]}},
].map(tool=>({...tool,annotations:{readOnlyHint:true,destructiveHint:false,idempotentHint:true,openWorldHint:false}}));

class CoreInputError extends Error {
  constructor(message='Arguments do not match the tool input schema.') { super(message); this.code='INVALID_INPUT'; }
}
function invokeTool(name, input) {
  const definition=TOOL_DEFINITIONS.find(x=>x.name===name);
  if(!definition) throw new CoreInputError('Unknown tool.');
  if(!input || typeof input!=='object' || Array.isArray(input)) throw new CoreInputError();
  const schema=definition.inputSchema;
  if(Object.keys(input).some(key=>!Object.hasOwn(schema.properties,key)) || schema.required.some(key=>!Object.hasOwn(input,key))) throw new CoreInputError();
  for(const [key,rule] of Object.entries(schema.properties)) {
    const value=input[key];
    if(typeof value!=='string' || (rule.enum&&!rule.enum.includes(value)) || (rule.minLength&&!value.trim()) || (rule.maxLength&&value.length>rule.maxLength)) throw new CoreInputError();
  }
  if(name==='dissect_links') return AfterClickCore('analyze',input);
  const {did,account,reused}=input;
  const detail={typed_password:'password',typed_card:'bank',sent_id_photo:'personal_info',installed_file:'nothing',clicked_only:'nothing'}[did];
  const answers={entry:did==='clicked_only'||did==='installed_file'?'clicked':'typed',details:[detail],accounts:[account==='not_sure'?'unknown':account],reuse:did==='typed_password'?(reused==='not_sure'?'unknown':reused):'na',locked:false};
  return AfterClickCore('incident',{answers,did});
}

function renderPlan(){if(!app.state?.currentId){app.screen='summary';renderSummary();return;}const st=app.state,s=st.steps.find(x=>x.id===st.currentId),i=st.steps.indexOf(s);main.innerHTML=demoNotice()+(app.notice?'<div class="notice">'+esc(app.notice)+'</div>':'')+'<section class="tag plan-tag" aria-labelledby="step-heading"><span class="hole" aria-hidden="true"></span><p class="eyebrow">Step '+(i+1)+' of '+st.steps.length+'</p><p class="context muted">'+esc(answerText())+'</p><h2 id="step-heading" class="focus-heading" tabindex="-1">'+esc(s.title)+'</h2><p>'+esc(s.action)+'</p><h3>Why now</h3><p class="muted">'+esc(s.why)+'</p><p class="source" style="overflow-wrap:anywhere">'+esc(s.condition)+'<br>'+s.sources.map(x=>esc(x.agency)+' — '+esc(x.url)).join('<br>')+'</p></section>'+progress()+'<p class="progress-count">'+counts()+'</p><p class="answer-summary">'+esc(answerText())+'</p><div class="plan-actions"><button class="outline" data-action="edit">Edit answers</button><button data-action="skip">Not for me</button></div><button class="primary next" data-action="done">'+(i===st.steps.length-1?'Done, view summary':'Done, next')+'</button><div class="summary-bar"><button data-action="summary">Review & copy summary</button><p>You choose what to share.<br>Nothing is sent.</p></div>'+undoBar()+'<details class="support-details"><summary>Not sure, or cannot sign in?</summary><p>Use Edit answers to record “Not sure” or “I cannot sign in” and update the checklist. Not for me records a skipped step, not a completed one. You can undo it or reopen it from your summary.</p></details>'+sessionActions();}
function makeSummary(){return AfterClickCore('summary',{answers:app.answers,state:app.state,unknowns:app.plan.unknowns,demo:app.demo,audience:app.audience});}
function renderSummary(){const st=app.state,pending=Object.values(st.statuses).filter(x=>x==='pending').length,skipped=Object.values(st.statuses).filter(x=>x==='skipped').length;main.innerHTML=(app.demo?'<div class="notice"><strong>Fictional demo.</strong> These are practice actions, not changes to real accounts.</div>':'')+(app.notice?'<div class="notice">'+esc(app.notice)+'</div>':'')+'<p class="eyebrow">Your record, your choice</p>'+heading(pending?'Review your progress.':'Your checklist is recorded.')+'<p>'+pending+' pending · '+skipped+' skipped. '+(pending?'You can return to any step below.':'You can reopen any step below.')+'</p><div class="fixed-next"><strong>Account and device safety: Unknown.</strong>Marking steps done does not confirm safety. Skipped steps are not completed.</div><ul class="review-list">'+st.steps.map(s=>'<li><span><strong>'+esc(s.title)+'</strong>'+({done:'✓ Done',skipped:'– Skipped — not completed',pending:'○ Pending'}[st.statuses[s.id]])+'</span><button data-action="reopen" data-value="'+s.id+'">'+(st.statuses[s.id]==='pending'?'Go to step':'Reopen')+'<span class="sr-only">: '+esc(s.title)+'</span></button></li>').join('')+'</ul><label class="wide-label" for="audience">Prepare wording for</label><select id="audience">'+Object.entries({support:'A trusted support contact',bank:'My bank',it:'My school or work IT desk',self:'My own notes'}).map(([v,t])=>'<option value="'+v+'" '+(app.audience===v?'selected':'')+'>'+t+'</option>').join('')+'</select><p class="hint">This changes the heading only. It does not select a recipient or send anything.</p><label class="wide-label" for="summary-text">Read before you copy</label><textarea class="summary-text" id="summary-text" readonly spellcheck="false">'+esc(makeSummary())+'</textarea><div class="check-actions"><button class="primary" data-action="copy">Copy summary</button><button data-action="select-summary">Select text manually</button></div><p id="copy-status" role="status" class="hint">Copying puts this text on your device’s clipboard. Share it yourself only if you choose.</p><div class="plan-actions">'+(pending?'<button class="outline" data-action="resume">Continue checklist</button>':'')+'<button data-action="edit">Edit answers</button></div>'+undoBar()+sessionActions();}
function renderChecker(){main.innerHTML='<button class="quiet back" data-action="home">← Back</button><p class="eyebrow">Before you click</p>'+heading('Look at where the link points.')+'<p>Remove names, addresses, codes, and other personal information before pasting. We only inspect the text in this tab.</p><label class="wide-label" for="message">Message text</label><textarea id="message" maxlength="12000" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Paste a redacted message with an https:// link…">'+esc(app.message)+'</textarea><p class="hint">Up to 12,000 characters and 10 different URLs. Explicit http:// or https:// links work best.</p><div class="check-actions"><button class="primary" data-action="check">Check link text</button><button data-action="example-message">Use fake message</button></div><div id="check-results"></div><div class="fixed-next"><strong>Verify in the official app or your own bookmark.</strong>Offline checks cannot confirm safety or follow redirects.</div><details><summary>How these checks work</summary><p>We check only visible URL structure: text before @, numeric addresses, service-like subdomains, internationalized labels, and HTTP. These are reasons to pause, not proof of fraud. A legitimate link may trigger a rule and a harmful link may trigger none.</p><p>Registered domains use a bundled Public Suffix List snapshot (2026-01-29, including private suffixes). Unknown suffixes, unsupported URLs, and short-link destinations remain Unknown. Domain ownership and the final destination after redirects are always Unknown.</p><p>URL paths and query strings are not displayed in results, stored in a log, or added to a summary. The original pasted text stays in this field until you clear the session or close the tab.</p></details>'+sessionActions();renderAnalysis();}
function renderAnalysis(){const box=main.querySelector('#check-results'),a=app.analysis;if(!a){box.innerHTML='';return;}box.innerHTML='<section class="result" aria-labelledby="result-heading"><h3 id="result-heading" tabindex="-1">'+esc(a.status)+'</h3><p class="hint">This is a rule-based text check, not a safety assessment. Final destination and domain owner: Unknown.</p>'+a.notes.map(n=>'<p class="empty">'+esc(n)+'</p>').join('')+a.items.map((item,i)=>'<article class="url-report"><p class="eyebrow">Link '+(i+1)+'</p><dl><dt>Specified host in the URL</dt><dd>'+esc(item.host)+'</dd><dt>Registered domain'+(item.demo?' · reserved demo name':'')+'</dt><dd class="domain">'+esc(item.domain||'Unknown / not applicable')+'</dd>'+(item.port?'<dt>Explicit non-default port</dt><dd>'+esc(item.port)+'</dd>':'')+'</dl>'+(item.flags.length?'<ul class="evidence">'+item.flags.map(f=>'<li><strong>'+(app.dismissed.includes(f.id)?'Dismissed by you — not a safety verdict. ':'Caution: ')+'</strong>'+esc(f.reason)+'<button class="dismiss" data-action="dismiss" data-value="'+f.id+'">'+(app.dismissed.includes(f.id)?'Restore warning':'Dismiss this warning')+'</button></li>').join('')+'</ul>':'<p class="hint">No structural flags found for this link. That does not establish safety.</p>')+item.unknowns.map(x=>'<p class="hint"><strong>Unknown:</strong> '+esc(x)+'</p>').join('')+'</article>').join('')+'</section>';}
function startDemo(){app=fresh();app.demo=true;app.answers={entry:'typed',details:['password'],accounts:['personal'],reuse:'yes',locked:false};app.plan=AfterClickCore('plan',app.answers);app.state=AfterClickCore('reconcile',{steps:app.plan.steps});app.screen='plan';app.notice='Practice scenario: a fictional delivery message used delivery.example.parcel-check.test. You entered a made-up password. No real password is requested.';render();announce('Fictional demo loaded. Step 1 of '+app.plan.steps.length+'. '+app.plan.steps[0].title+'.');}
function edit(){app.draft=structuredClone(app.answers);app.editing=true;app.screen='questions';render();}
async function copySummary(){const field=main.querySelector('#summary-text'),text=field.value;try{if(!navigator.clipboard?.writeText)throw new Error('Clipboard unavailable');await navigator.clipboard.writeText(text);if(app.screen==='summary'){main.querySelector('#copy-status').textContent='Copied to your clipboard. Nothing was sent.';announce('Summary copied. Nothing was sent.');}}catch(_){if(app.screen==='summary'){field.focus();field.select();main.querySelector('#copy-status').textContent='Automatic copy is unavailable. Text selected: use your device’s Copy command (Ctrl+C or Command+C).';announce('Automatic copy unavailable. Copy the selected text manually.');}}}
document.getElementById('demo').addEventListener('click',startDemo);
main.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='questions')applyAnswers();});
main.addEventListener('input',e=>{if(e.target.id==='message'){app.message=e.target.value;app.analysis=null;app.dismissed=[];renderAnalysis();}});
main.addEventListener('change',e=>{const t=e.target;if(t.name==='details'||t.name==='accounts'){const exclusive=t.name==='details'?['nothing','unknown']:['unknown'];if(t.checked){main.querySelectorAll('[name="'+t.name+'"]').forEach(x=>{if(x!==t&&(exclusive.includes(t.value)||exclusive.includes(x.value)))x.checked=false;});}readDraft();updateReuse();}else if(t.name==='reuse'||t.name==='locked')readDraft();else if(t.id==='audience'){app.audience=t.value;main.querySelector('#summary-text').value=makeSummary();}});
main.addEventListener('click',e=>{const button=e.target.closest('button[data-action]');if(!button)return;const action=button.dataset.action,value=button.dataset.value;
  if(action==='choose'){if(value==='notclicked'){app.screen='checker';render();}else startQuestions(value);}
  if(action==='home'){app.screen='home';render();}
  if(action==='clear'){app=fresh();render();announce('Session cleared. Answers, pasted text, and progress have been removed from this tab. Any previously copied clipboard text is unchanged.');}
  if(action==='cancel-answers'){app.screen=app.editing?(app.state.currentId?'plan':'summary'):'home';app.draft=null;app.editing=false;render();}
  if(action==='edit')edit();
  if(action==='resume'){app.screen=app.state.currentId?'plan':'summary';render();}
  if(action==='done'||action==='skip'){const title=app.state.steps.find(s=>s.id===app.state.currentId).short;app.state=AfterClickCore('transition',{state:app.state,command:action==='done'?'done':'skipped'});app.notice=action==='skip'?title+' was skipped, not completed. Use Undo last action to restore it.':'';app.screen=app.state.currentId?'plan':'summary';render();announce(title+(action==='done'?' marked done.':' marked skipped, not completed.'));}
  if(action==='undo'){app.state=AfterClickCore('transition',{state:app.state,command:'undo'});app.notice='Last action undone. Your previous status has been restored.';app.screen=app.state.currentId?'plan':'summary';render();announce(app.notice);}
  if(action==='summary'){app.screen='summary';app.notice='';render();}
  if(action==='reopen'){app.state=AfterClickCore('transition',{state:app.state,command:'reopen',id:value});app.screen='plan';app.notice='Step reopened. Choose Done, next only after you complete it, or Not for me to record a skip.';render();}
  if(action==='copy')copySummary();
  if(action==='select-summary'){const field=main.querySelector('#summary-text');field.focus();field.select();main.querySelector('#copy-status').textContent='Text selected. Use your device’s Copy command (Ctrl+C or Command+C).';}
  if(action==='example-message'){app.message=FAKE_MESSAGE;app.dismissed=[];app.analysis=AfterClickCore('analyze',{text:app.message});renderChecker();main.querySelector('#result-heading').focus();announce('Fictional message loaded and checked. '+app.analysis.status+'.');}
  if(action==='check'){app.message=main.querySelector('#message').value;app.dismissed=[];app.analysis=AfterClickCore('analyze',{text:app.message});renderAnalysis();main.querySelector('#result-heading').focus();announce('Check complete. '+app.analysis.status+'.');}
  if(action==='dismiss'){app.dismissed=app.dismissed.includes(value)?app.dismissed.filter(x=>x!==value):[...app.dismissed,value];app.analysis=AfterClickCore('analyze',{text:app.message,dismissed:app.dismissed});renderAnalysis();main.querySelector('[data-value="'+value+'"]').focus();announce(app.dismissed.includes(value)?'Warning dismissed. This does not confirm safety.':'Warning restored.');}
});
render(false);
</script>
</body>
</html>
